<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>송린중 과학 골든벨</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}
/* Layout: one column "stage" — header strip with bell + status, question card, a handheld answer board below it (whiteboard in light, chalkboard in dark). */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#16213A; --muted:#5B6680; --line:#D5DBE6;
  --gold:#D9A520; --gold-ink:#8A6100; --gold-soft:#FBF1D6;
  --board:#FBFCFD; --board-frame:#A3ABB9; --board-ink:#1E3A8A; --board-hint:#9AA5BC;
  --ok:#1F7A4D; --ok-soft:#E3F3EA; --bad:#B9461A; --bad-soft:#FBE9E1;
  --btn:#16213A; --btn-ink:#FFFFFF;
  --f-display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-hand:"Gaegu","Nanum Pen Script","Apple SD Gothic Neo",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1626; --surface:#172036; --ink:#E8ECF4; --muted:#98A3BA; --line:#2A3550;
  --gold:#E4B33A; --gold-ink:#F0C75E; --gold-soft:#2E2A1C;
  --board:#22302A; --board-frame:#6B5A3E; --board-ink:#F3F1E7; --board-hint:#7F8C84;
  --ok:#5CC98A; --ok-soft:#173326; --bad:#F2895B; --bad-soft:#3A2119;
  --btn:#E4B33A; --btn-ink:#16213A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1626; --surface:#172036; --ink:#E8ECF4; --muted:#98A3BA; --line:#2A3550;
  --gold:#E4B33A; --gold-ink:#F0C75E; --gold-soft:#2E2A1C;
  --board:#22302A; --board-frame:#6B5A3E; --board-ink:#F3F1E7; --board-hint:#7F8C84;
  --ok:#5CC98A; --ok-soft:#173326; --bad:#F2895B; --bad-soft:#3A2119;
  --btn:#E4B33A; --btn-ink:#16213A; color-scheme:dark}

html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;gap:12px}
.bell{width:40px;height:40px;flex:none;transform-origin:50% 8%}
.top h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1;margin:0;letter-spacing:.01em}
.top .sub{font-size:13px;color:var(--muted)}
.top .grow{flex:1;min-width:0}
.snd{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:10px;width:44px;height:44px;display:grid;place-items:center;flex:none}
.snd svg{width:22px;height:22px}
.snd[aria-pressed="false"]{color:var(--muted)}
.ring .bell{animation:ring 1.2s ease-in-out 2}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(18deg)}30%{transform:rotate(-16deg)}45%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}75%{transform:rotate(4deg)}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}

/* setup */
.setup{display:flex;flex-direction:column;gap:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:baseline}
.chip small{color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.chip[aria-pressed="true"] small{color:var(--gold-ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{background:transparent;border:0;color:var(--ink);padding:8px 14px;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.row{display:flex;flex-wrap:wrap;gap:20px 28px}
.row > div{min-width:0}
.mini{font-size:13px;color:var(--muted);margin:6px 0 0}
.go{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{background:var(--btn);color:var(--btn-ink);border:0;border-radius:10px;padding:12px 22px;font-weight:600;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px;font-size:13px}
.best{font-size:13px;color:var(--muted)}

/* status */
.status{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.status .prog{flex:1;min-width:140px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.status .prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.lives{display:flex;gap:2px}
.lives svg{width:20px;height:20px}
.lives .lost{opacity:.18}
.stat{font-size:14px;color:var(--muted)}
.stat b{color:var(--ink);font-weight:600}
.timer{height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--ink);width:100%}
.timer.low i{background:var(--bad)}

/* question */
.qmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.unit{background:var(--gold-soft);color:var(--gold-ink);border-radius:6px;padding:2px 8px;font-weight:600}
.qnum{font-family:var(--f-display);font-size:44px;line-height:1;color:var(--gold-ink);font-variant-numeric:tabular-nums}
.qhead{display:flex;gap:16px;align-items:flex-start}
.qtext{font-size:21px;font-weight:500;line-height:1.6;margin:4px 0 0;text-wrap:pretty;word-break:keep-all;overflow-wrap:anywhere;min-width:0}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--gold);margin:0 .15em;height:1.1em;vertical-align:-.15em}

/* answer board */
.board{background:var(--board);border:10px solid var(--board-frame);border-radius:12px;padding:14px 16px;box-shadow:0 2px 0 var(--line)}
.board input{width:100%;background:transparent;border:0;color:var(--board-ink);font-family:var(--f-hand);font-weight:700;font-size:38px;line-height:1.2;padding:4px 2px;box-sizing:border-box}
.board input::placeholder{color:var(--board-hint);font-weight:400}
.board input:focus{outline:none}
.board:focus-within{border-color:var(--gold)}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ox button{background:var(--board);border:10px solid var(--board-frame);border-radius:12px;color:var(--board-ink);font-family:var(--f-hand);font-weight:700;font-size:72px;line-height:1;padding:18px 0}
.ox button:hover{border-color:var(--gold)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{font-size:13px;color:var(--muted)}

/* feedback */
.fb{border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px}
.fb p{margin:0;color:var(--ink)}
.fb .ans{font-family:var(--f-hand);font-weight:700;font-size:28px;color:var(--ink)}

/* result */
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font-family:var(--f-display);font-size:72px;line-height:1;color:var(--gold-ink);font-variant-numeric:tabular-nums}
.score .of{font-size:20px;color:var(--muted)}
.verdict{font-family:var(--f-display);font-size:30px;margin:4px 0 0;font-weight:400}
.wrong{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:6px}
.wrong div{display:grid;grid-template-columns:3.2em 1fr;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.wrong .n{font-family:var(--f-display);font-size:20px;color:var(--gold-ink);font-variant-numeric:tabular-nums}
.wrong .q{min-width:0;word-break:keep-all;overflow-wrap:anywhere}
.wrong .a{grid-column:2;font-size:14px;color:var(--muted)}
.wrong .a b{color:var(--ok)}
.wrong .a s{color:var(--bad)}

@media (max-width:480px){
  .qnum{font-size:34px}.qtext{font-size:18px}.board input{font-size:32px}.ox button{font-size:56px}
  .top h1{font-size:23px}.card{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="wrap" id="app">
  <header class="top" id="top">
    <svg class="bell" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="5" r="3" fill="var(--gold)"/>
      <path d="M20 6c-7 0-11 5-11 12v7l-4 5h30l-4-5v-7c0-7-4-12-11-12z" fill="var(--gold)"/>
      <path d="M13 17c0-4 3-7 6-7" stroke="var(--surface)" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/>
      <circle cx="20" cy="34" r="3.5" fill="var(--gold-ink)"/>
    </svg>
    <div class="grow">
      <h1>과학 골든벨</h1>
      <div class="sub">송린중학교 2학년 · 277문제</div>
    </div>
    <button type="button" class="snd" id="snd" aria-pressed="true" aria-label="효과음 켜짐" title="효과음 켜기/끄기"></button>
  </header>
  <main id="view"></main>
</div>

<script>
const UNITS=[[1,23,'생물의 구성과 다양성'],[24,46,'열'],[47,73,'물질의 상태 변화'],[74,103,'힘의 작용'],[104,115,'기체의 압력과 부피'],[116,143,'태양계'],[144,157,'물질의 특성'],[158,179,'지권의 변화'],[180,197,'빛과 파동'],[198,219,'물질의 구성'],[220,236,'식물과 에너지'],[237,277,'동물과 에너지']];
// 번호|문제|정답|인정 답(;로 구분)
const RAW=`1|세포를 처음 발견한 학자의 이름은 무엇인가?|로버트 훅|훅
2|(   )는/은 생명 활동이 일어나는 기본단위이다.|세포|
3|동물세포와 식물세포 모두 있는 소기관은 (   ), 세포막, 세포질, 마이토콘드리아가 있다.|핵|
4|엽록체의 기능은?|광합성, 양분 생성|광합성
5|동물세포에는 없으나 식물세포에만 있는 구조 두 가지는 무엇인가?|세포벽, 엽록체|엽록체, 세포벽
6|에너지를 생산하는 기능을 하는 세포 소기관은?|마이토콘드리아|미토콘드리아
7|원반 모양으로 산소를 운반하는 세포는?|적혈구|
8|길고 돌기가 가늘며 자극을 전달하는 세포는?|신경세포|뉴런
9|유전정보를 저장하고 세포 활동을 조절하는 것은?|핵|
10|세포 안팎으로 물질의 출입을 조절하는 것은?|세포막|
11|동물의 구성 단계에서는 세포 → 조직 → 기관 → (   ) → 개체이다.|기관계|
12|식물의 구성 단계에서 세포 → 조직 → (   ) → 기관 → 개체이다.|조직계|
13|여러 개가 겹쳐 피부나 내장 안쪽 표면을 덮고 있어 우리 몸을 보호하는 세포는?|상피세포|
14|생태계나 특정 지역에 사는 생물의 다양한 정도를 무엇이라고 하는가?|생물 다양성|
15|같은 종류의 생물 사이에서 나타나는 생김새나 특성의 차이는?|변이|
16|생물 분류 체계에서 가장 기본이 되는 단위는?|종|
17|분류체계는 종 → 속 → 과 → (   ) → 강 → 문 → (   )이다.|목, 계|
18|세포에 핵이 없는 생물 무리를 (   )계라고 한다.|원핵생물계|원핵생물
19|세포에 핵이 있는 생물 중 광합성을 하여 스스로 영양분을 만드는 생물 무리는?|식물계|
20|세포에 핵이 있는 생물 중 죽은 생물이나 배설물을 분해하여 영양분을 얻는 생물 무리는?|균계|
21|세포에 핵이 있으며 식물계, 균계, 동물계에 속하지 않는 생물 무리는?|원생생물계|
22|다세포 생물이며, 다른 생물들을 먹이로 먹어 영양분을 얻는 생물 무리는?|동물계|
23|아메바, 짚신벌레, 파래는 (   )계이다.|원생생물|원생생물계
24|열이 이동하는 세 가지 방법에는 전도, (   ), 복사가 있다.|대류|
25|모든 물질은 그 물질의 고유한 성질을 갖는 매우 작은 알갱이인 (   )로 이루어져 있다.|입자|
26|입자의 운동이 활발해지면 (   )가 높아지고, 입자의 운동이 둔해지면 (   )가 낮아진다. 빈칸에 공통으로 들어갈 말은?|온도|
27|열은 온도가 (   )은 물체에서 온도가 (   )은 물체로 이동한다.|높, 낮|높은, 낮은
28|온도가 높은 물체에서 온도가 낮은 물체로 열이 이동하여 두 물체의 온도가 같아진 상태를 뭐라고 하는가?|열평형|
29|물질을 구성하는 입자의 운동이 이웃한 입자에 차례로 전달되어 열이 이동하는 방식은?|전도|
30|열을 얻은 액체나 기체 입자가 직접 이동하면서 열이 이동하는 방식은?|대류|
31|전도와 대류와는 달리 물질의 도움 없이 열이 직접 이동하는 방식은?|복사|
32|열평형 과정에서 온도가 높은 물체는 열을 (   )고, 온도가 낮은 물체는 열을 (   )다.|잃, 얻는|잃, 얻;잃고, 얻는다;잃는, 얻는
33|물체를 구성하는 입자 운동의 활발한 정도를 무엇이라고 하는가?|온도|
34|물체의 온도가 변할 때 이동한 열의 양을 무엇이라고 하는가?|열량|
35|바닷물이 위에서 아래로 섞이는 현상은?|대류|
36|태양빛이 지구에 도달하는 방식은?|복사|
37|열량의 단위는?|kcal, cal, J|kcal;cal;J;칼로리;킬로칼로리;줄
38|1kg 물질의 온도를 1℃ 올리는 데 필요한 열을 무엇이라고 하는가?|비열|
39|비열이 큰 물질은 온도 변화가 (작/크)다.|작|작다
40|여름철 모래와 바다 중에 비열이 큰 물질은?|바다|바닷물;물
41|물체에 열을 가했을 때 물체의 길이나 부피가 늘어나는 현상은?|열팽창|
42|열팽창 정도가 다른 두 종류의 얇은 금속을 붙여서 만든 것을 뭐라고 하는가?|바이메탈|
43|같은 질량의 물과 식용유를 동시에 가열하면 식용유의 온도가 물의 온도보다 더 크게 높아진다. 따라서 물과 식용유 중 비열이 작은 물질은?|식용유|
44|열팽창은 물체를 가열하면 물체를 구성하는 입자 사이의 (   )가 멀어져 나타나는 현상이다.|거리|
45|자동차 엔진 냉각수에 물을 이용하는 것은 물의 (   )이 큰 성질을 활용한 예이다.|비열|
46|전기 주전자, 토스터 등에 사용되는 바이메탈은 (   ) 정도가 물질에 따라 다른 성질을 활용한 예이다.|열팽창|
47|입자가 스스로 운동하여 액체 표면에서 기체로 변하는 현상은?|증발|
48|입자가 스스로 운동하여 멀리 퍼져 나가는 현상은?|확산|
49|고체가 액체로 변하는 상태 변화를 무엇이라고 하는가?|융해|
50|액체가 고체로 변하는 상태 변화를 무엇이라고 하는가?|응고|
51|액체가 기체로 변하는 상태 변화를 무엇이라고 하는가?|기화|
52|기체가 액체로 변하는 상태 변화를 무엇이라고 하는가?|액화|
53|기체가 직접 고체로 변하는 상태 변화를 무엇이라고 하는가?|승화|
54|고체가 직접 기체로 변하는 상태 변화를 무엇이라고 하는가?|승화|
55|입자 배열 규칙적, 부피·모양 일정한 상태를 무엇이라고 하는가?|고체|
56|부피 일정, 모양 변화하는 상태를 무엇이라고 하는가?|액체|

const parse=(raw,v)=>raw.split('\n').map(l=>{const [n,q,a,alt]=l.split('|');const no=+n;
  const u=UNITS.findIndex(x=>no>=x[0]&&no<=x[1]);
  return {no,key:no+(v?'v':''),v,q,a,alt:alt?alt.split(';'):[],u,ox:a==='O'||a==='X'}});
const QS=parse(RAW,false), VQ=parse(RAW_V,true);
const getQ=k=>String(k).endsWith('v')?VQ[parseInt(k)-1]:QS[parseInt(k)-1];

const norm=s=>String(s).toLowerCase().replace(/[\s,.·()\-–~'"\/、]/g,'');
function isRight(item,input){
  if(item.ox) return input===item.a;
  const v=norm(input); if(!v) return false;
  const cands=[item.a,item.a.replace(/\([^)]*\)/g,''),...item.alt].map(norm);
  return cands.includes(v);
}

const store={get(k,d){try{const v=localStorage.getItem('gb_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('gb_'+k,JSON.stringify(v))}catch(e){}}};

/* 효과음: Web Audio로 직접 합성 (파일 없음) */
const SFX={ctx:null,on:store.get('sound',true),
  init(){try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
    try{if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)();
      if(this.ctx.state!=='running')this.ctx.resume();
      const buf=this.ctx.createBuffer(1,1,22050),src=this.ctx.createBufferSource();src.buffer=buf;src.connect(this.ctx.destination);src.start(0)}catch(e){}},
  tone(f,at,dur,type,vol,f2){if(!this.on||!this.ctx)return;const c=this.ctx,t=c.currentTime+at,o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.05)},
  ok(){this.tone(880,0,.15,'triangle',.25);this.tone(1318.5,.1,.35,'triangle',.25)},
  bad(){this.tone(196,0,.4,'sawtooth',.09,110);this.tone(185,0,.4,'square',.05,104)},
  tick(){this.tone(1500,0,.06,'sine',.08)},
  start(){[523.25,659.25,783.99].forEach((f,i)=>this.tone(f,i*.08,.2,'triangle',.18))},
  good(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>this.tone(f,i*.11,i===3?.6:.2,'triangle',.2))},
  out(){[392,329.6,261.6].forEach((f,i)=>this.tone(f,i*.22,.35,'triangle',.2));this.tone(196,.66,.7,'triangle',.2)},
  bell(){for(let r=0;r<3;r++)[[1,.22,2.2],[2,.1,1.6],[2.76,.08,1.1],[5.4,.04,.6]].forEach(([m,v,d])=>this.tone(880*m,r*.7,d,'sine',v))}
};

  b.innerHTML=SFX.on?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>'
  :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>'}
document.getElementById('snd').onclick=()=>{SFX.on=!SFX.on;store.set('sound',SFX.on);SFX.init();sndBtn();if(SFX.on)SFX.ok()};
sndBtn();
['pointerdown','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(!SFX.ctx||SFX.ctx.state!=='running')SFX.init()},true));

let cfg=Object.assign({units:UNITS.map((_,i)=>i),count:20,mode:'practice',timer:0,order:'random',qtype:'orig'},store.get('cfg',{}));

const view=document.getElementById('view');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtQ=q=>esc(q).replace(/\(\s{2,}\)/g,'<span class="blank" aria-label="빈칸"></span>');

function bellSvg(cls){return `<svg viewBox="0 0 40 40" class="${cls||''}" aria-hidden="true"><path d="M20 6c-7 0-11 5-11 12v7l-4 5h30l-4-5v-7c0-7-4-12-11-12z" fill="var(--gold)"/><circle cx="20" cy="34" r="3.5" fill="var(--gold-ink)"/></svg>`}

function pool(){const t=cfg.qtype||'orig';return QS.filter(x=>cfg.units.includes(x.u)).map(x=>t==='var'||(t==='mix'&&Math.random()<.5)?VQ[x.no-1]:x)}

/* ---------- setup ---------- */

  view.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;let v=b.dataset.v;
    cfg[k]=(k==='count'||k==='timer')?+v:v;save();renderSetup()});
  document.getElementById('all').onclick=()=>{cfg.units=UNITS.map((_,i)=>i);save();renderSetup()};
  document.getElementById('none').onclick=()=>{cfg.units=[];save();renderSetup()};

function save(){store.set('cfg',cfg)}

/* ---------- game ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function startGame(list,opts={}){
  let qs=cfg.order==='seq'&&!opts.retry?list.slice():shuffle(list);
  if(cfg.count&&!opts.retry) qs=qs.slice(0,cfg.count);
  S={ids:qs.map(x=>x.key),i:0,score:0,lives:(!opts.retry&&cfg.mode==='bell')?3:99,
     mode:opts.retry?'practice':cfg.mode,wrong:[],phase:'ask',last:null,t0:Date.now(),streak:0};
  renderQ();
}
const cur=()=>getQ(S.ids[S.i]);

function statusBar(){
  const n=S.ids.length;
  const lives=S.mode==='bell'?`<div class="lives" aria-label="남은 목숨 ${S.lives}개">${[0,1,2].map(k=>bellSvg(k<S.lives?'':'lost')).join('')}</div>`:'';
  return `<div class="status"><span class="stat"><b>${S.i+1}</b> / ${n}</span><div class="prog"><i style="width:${(S.i)/n*100}%"></i></div>${lives}<span class="stat">맞힌 수 <b>${S.score}</b></span></div>`;
}

function renderQ(){
  clearInterval(tick);
  const it=cur();S.phase='ask';
  const unit=UNITS[it.u][2];
  const answerUI=it.ox
    ?`<div class="ox"><button type="button" data-ox="O" aria-label="O, 맞다">O</button><button type="button" data-ox="X" aria-label="X, 틀리다">X</button></div><p class="hint">키보드 O / X 키로도 고를 수 있어요</p>`
    :`<form id="f" class="board" autocomplete="off"><label for="ans" class="label" style="color:var(--board-hint)">정답 쓰기</label><input id="ans" name="ans" placeholder="여기에 답을 쓰세요" enterkeyhint="done"></form>
      <div class="actions"><button type="button" class="btn" id="submit">제출</button><button type="button" class="btn ghost" id="pass">모르겠어요</button><span class="hint">Enter로 제출</span></div>`;
  view.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
    ${statusBar()}
    ${cfg.timer?'<div class="timer" id="tm"><i></i></div>':''}
    <section class="card"><div class="qhead"><div class="qnum">${it.no}</div><div style="min-width:0">
      <div class="qmeta"><span class="unit">${unit}</span>${it.v?'<span class="unit">변형</span>':''}${it.ox?'<span>O / X</span>':''}</div>

    <div><button type="button" class="linkbtn" id="quit">그만하고 결과 보기</button></div>
  </div>`;
  if(it.ox){view.querySelectorAll('[data-ox]').forEach(b=>b.onclick=()=>answer(b.dataset.ox))}
  else{const inp=document.getElementById('ans');
    document.getElementById('f').onsubmit=e=>{e.preventDefault();answer(inp.value)};
    document.getElementById('submit').onclick=()=>answer(inp.value);
    document.getElementById('pass').onclick=()=>answer('');
    setTimeout(()=>inp.focus({preventScroll:true}),30)}
  document.getElementById('quit').onclick=()=>renderEnd(true);
  if(cfg.timer){let lastSec=0;const end=Date.now()+cfg.timer*1000,bar=document.querySelector('#tm i'),box=document.getElementById('tm');
    tick=setInterval(()=>{const left=end-Date.now();bar.style.width=Math.max(0,left/(cfg.timer*1000)*100)+'%';
      box.classList.toggle('low',left<5000);
      const sec=Math.ceil(left/1000);if(left<5000&&left>0&&sec!==lastSec){lastSec=sec;SFX.tick()}
      if(left<=0){clearInterval(tick);const inp=document.getElementById('ans');answer(inp?inp.value:'',true)}},100)}
}

function answer(input,timeout){
  if(S.phase!=='ask')return;clearInterval(tick);
  const it=cur();const ok=isRight(it,input.trim());
  S.phase='fb';S.last={no:it.no,key:it.key,input:input.trim(),ok,timeout:!!timeout};
  if(ok){S.score++;SFX.ok()}else{SFX.bad();S.wrong.push({key:it.key,input:input.trim()});if(S.mode==='bell')S.lives--}
  renderFb();
}
function override(){ // 내 답도 맞아요
  const L=S.last;if(!L||L.ok)return;L.ok=true;S.score++;SFX.ok();
  S.wrong=S.wrong.filter(w=>w.key!==L.key);if(S.mode==='bell')S.lives++;renderFb();
}
function renderFb(){
  const it=cur(),L=S.last;const area=document.getElementById('ansArea');
  const out=S.mode==='bell'&&S.lives<=0;const last=S.i>=S.ids.length-1;
  const canOverride=!L.ok&&!it.ox&&L.input;
  area.innerHTML=`<div class="fb ${L.ok?'ok':'bad'}" role="status">
      <h3>${L.ok?'정답!':(L.timeout?'시간 초과':'아쉬워요')}</h3>
      ${L.input&&!it.ox?`<p>내 답: ${esc(L.input)}</p>`:''}
      ${L.ok&&!it.ox&&norm(L.input)===norm(it.a)?'':`<p>정답 <span class="ans">${esc(it.a)}</span></p>`}
    </div>
    <div class="actions"><button type="button" class="btn" id="next">${out?'결과 보기':last?'결과 보기':'다음 문제'}</button>
    ${canOverride?'<button type="button" class="btn ghost" id="ovr">제 답도 맞아요</button>':''}
    <span class="hint">Enter로 넘어가기</span></div>`;
  // refresh status
  const st=view.querySelector('.status');if(st)st.outerHTML=statusBar();
  document.getElementById('next').onclick=next;
  const o=document.getElementById('ovr');if(o)o.onclick=override;
  document.getElementById('next').focus({preventScroll:true});
}
function next(){
  if(S.mode==='bell'&&S.lives<=0)return renderEnd(false);
  if(S.i>=S.ids.length-1)return renderEnd(false);
  S.i++;renderQ();
}

function renderEnd(quit){
  clearInterval(tick);
  const answered=S.phase==='fb'?S.i+1:S.i;S.phase='end';const n=S.ids.length;
  const pct=answered?Math.round(S.score/answered*100):0;
  const eliminated=S.mode==='bell'&&S.lives<=0;
  const champ=S.mode==='bell'&&!eliminated&&!quit&&answered===n;
  let verdict=eliminated?`${answered}번째 문제에서 탈락했어요`:champ?'골든벨을 울렸어요!':pct>=90?'아주 잘했어요':pct>=70?'좋아요, 조금만 더':'틀린 문제를 다시 풀어 봐요';
  if(S.mode==='bell'){const best=store.get('best',{});const surv=eliminated?answered-1:S.score;
    if(best.bell==null||surv>best.bell){best.bell=surv;store.set('best',best)}}
  document.getElementById('app').classList.toggle('ring',champ);
  if(champ)SFX.bell();else if(eliminated)SFX.out();else if(answered&&pct>=70)SFX.good();
  const wrongItems=S.wrong.map(w=>({...getQ(w.key),input:w.input}));
  view.innerHTML=`<section class="card" style="display:flex;flex-direction:column;gap:16px">
    <div><div class="score"><span class="big">${S.score}</span><span class="of">/ ${answered}문제 · 정답률 ${pct}%</span></div>
    <p class="verdict">${verdict}</p></div>
    <div class="go">${wrongItems.length?`<button type="button" class="btn" id="retry">틀린 ${wrongItems.length}문제 다시 풀기</button>`:''}
      <button type="button" class="btn ${wrongItems.length?'ghost':''}" id="again">처음으로</button></div>
    ${wrongItems.length?`<div><p class="label">틀린 문제</p><div class="wrong">${wrongItems.map(w=>`<div><span class="n">${w.no}</span><span class="q">${w.v?'[변형] ':''}${fmtQ(w.q)}</span><span class="a">정답 <b>${esc(w.a)}</b>${w.input?` · 내 답 <s>${esc(w.input)}</s>`:' · 답을 쓰지 않음'}</span></div>`).join('')}</div></div>`:''}
  </section>`;
  document.getElementById('again').onclick=renderSetup;
  const r=document.getElementById('retry');if(r)r.onclick=()=>startGame(wrongItems.map(w=>getQ(w.key)),{retry:true});
}

document.addEventListener('keydown',e=>{
  if(!S)return;
  if(S.phase==='ask'&&cur().ox){const k=e.code;if(k==='KeyO'){e.preventDefault();answer('O')}else if(k==='KeyX'){e.preventDefault();answer('X')}}
  else if(S.phase==='fb'&&e.key==='Enter'&&document.activeElement?.id!=='ovr'){e.preventDefault();next()}
});

function start(data){
  if(data&&data.S&&data.S.phase!=='end'){S=data.S;if(S.phase==='fb')next();else renderQ()}
  else renderSetup();
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>

</body>
